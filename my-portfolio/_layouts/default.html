<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>

  <header class="site-header">
    <div class="wrap">
      <a class="site-brand" href="{{ '/' | relative_url }}">
        <svg class="pencil-mark" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 20l1.2-4.6L15.6 5 19 8.4 8.6 18.8 4 20z" stroke="#355c4a" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M13.2 6.4L17.6 10.8" stroke="#355c4a" stroke-width="1.3"/>
        </svg>
        <span>{{ site.title }}</span>
      </a>
      <nav class="site-nav" aria-label="주 메뉴">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="is-active"{% endif %}>홈</a>
        <a href="{{ '/projects.html' | relative_url }}" {% if page.url == '/projects.html' %}class="is-active"{% endif %}>프로젝트</a>
        <a href="{{ '/posts.html' | relative_url }}" {% if page.url == '/posts.html' %}class="is-active"{% endif %}>모든 글</a>
        <a href="{{ '/categories.html' | relative_url }}" {% if page.url == '/categories.html' %}class="is-active"{% endif %}>카테고리</a>
        <a href="{{ '/about.html' | relative_url }}" {% if page.url == '/about.html' %}class="is-active"{% endif %}>소개</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author }}. {{ site.title }}</p>
    </div>
  </footer>
</body>
</html>
